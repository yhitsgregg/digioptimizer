<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tombola Drum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>

<style>
  :root {
    --ground:     #E7E1CE;
    --ground-2:   #F1ECDD;
    --ink:        #16352A;
    --ink-soft:   #566C60;
    --line:       #CDC5AB;
    --ball-face:  #16352A;
    --ball-num:   #F1ECDD;
    --ball-hi:    rgba(255,255,255,.16);
    --ball-shadow: rgba(22,53,42,.28);
    --accent:     #B8402A;
    --accent-ink: #F6EFE1;
    --brass:      #A8792A;
    --slot-empty: rgba(22,53,42,.28);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:     #0D211A;
      --ground-2:   #133026;
      --ink:        #E8E1CD;
      --ink-soft:   #8CA095;
      --line:       #24473A;
      --ball-face:  #EBE4D0;
      --ball-num:   #123026;
      --ball-hi:    rgba(255,255,255,.6);
      --ball-shadow: rgba(0,0,0,.5);
      --accent:     #D2543A;
      --accent-ink: #180B07;
      --brass:      #C79B45;
      --slot-empty: rgba(232,225,205,.26);
    }
  }
  :root[data-theme="dark"] {
    --ground:     #0D211A;
    --ground-2:   #133026;
    --ink:        #E8E1CD;
    --ink-soft:   #8CA095;
    --line:       #24473A;
    --ball-face:  #EBE4D0;
    --ball-num:   #123026;
    --ball-hi:    rgba(255,255,255,.6);
    --ball-shadow: rgba(0,0,0,.5);
    --accent:     #D2543A;
    --accent-ink: #180B07;
    --brass:      #C79B45;
    --slot-empty: rgba(232,225,205,.26);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: var(--ground);
    background-image: radial-gradient(115% 85% at 50% 0%, transparent 40%, var(--ball-shadow) 160%);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .drum {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  /* ---- eyebrow ---- */
  .masthead { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .masthead h1 {
    margin: 0;
    font-family: Fraunces, Georgia, serif;
    font-variation-settings: "opsz" 120, "SOFT" 0, "WONK" 1;
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: .01em;
  }
  .rule {
    display: flex; align-items: center; gap: 10px;
    font-size: .6875rem; font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .rule::before, .rule::after {
    content: ""; width: 26px; height: 1px; background: var(--line);
  }

  /* ---- the ball ---- */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 16px; }

  .ball {
    width: clamp(190px, 52vw, 232px);
    aspect-ratio: 1;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 34% 28%, var(--ball-hi), transparent 52%),
      var(--ball-face);
    box-shadow: 0 16px 34px -14px var(--ball-shadow);
    position: relative;
  }
  .ball::after {
    content: "";
    position: absolute;
    inset: 13px;
    border-radius: 50%;
    border: 1px solid color-mix(in srgb, var(--ball-num) 22%, transparent);
  }
  .numeral {
    font-family: Fraunces, Georgia, serif;
    font-variation-settings: "opsz" 144, "SOFT" 0, "WONK" 1;
    font-weight: 900;
    font-size: clamp(5rem, 15vw, 6.25rem);
    line-height: 1;
    color: var(--ball-num);
    font-variant-numeric: tabular-nums lining-nums;
  }
  .ball.is-empty .numeral {
    font-size: clamp(2rem, 6vw, 2.5rem);
    font-weight: 500;
    opacity: .5;
  }

  @keyframes tumble {
    0%   { transform: none; }
    15%  { transform: translate3d(-15px, -9px, 0) rotate(-9deg); }
    32%  { transform: translate3d(13px, 7px, 0) rotate(8deg); }
    50%  { transform: translate3d(-11px, 5px, 0) rotate(-6deg); }
    68%  { transform: translate3d(9px, -7px, 0) rotate(5deg); }
    85%  { transform: translate3d(-5px, 3px, 0) rotate(-2deg); }
    100% { transform: none; }
  }
  .ball.is-tumbling { animation: tumble .58s cubic-bezier(.36,.07,.28,.98); }

  @keyframes settle {
    from { transform: scale(.8); opacity: .3; }
    to   { transform: scale(1); opacity: 1; }
  }
  .numeral.is-settling { animation: settle .26s cubic-bezier(.2,.9,.3,1.3); }

  .caption {
    min-height: 1.25rem;
    font-size: .8125rem;
    color: var(--ink-soft);
    text-align: center;
  }

  /* ---- controls ---- */
  .controls { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: 0;
    transition: background-color .16s, color .16s, opacity .16s, transform .06s;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .shake {
    width: 100%;
    padding: 17px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: .9375rem;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
  }
  .shake:active:not(:disabled) { transform: translateY(1px); }
  .shake:disabled { opacity: .4; cursor: not-allowed; letter-spacing: .12em; }

  .reset {
    background: none;
    color: var(--ink-soft);
    font-size: .8125rem;
    letter-spacing: .04em;
    padding: 6px 10px;
    border-radius: 6px;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--line);
  }
  .reset:hover { color: var(--ink); }

  /* ---- rack ---- */
  .rack { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .rack-label {
    display: flex; justify-content: space-between; align-items: baseline;
    width: 100%;
    font-size: .6875rem; font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  .tally { font-variant-numeric: tabular-nums; letter-spacing: .08em; }

  .slots {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    width: 100%;
  }
  .slot {
    aspect-ratio: 1;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: .875rem;
    font-variant-numeric: tabular-nums;
    border: 1px dashed var(--slot-empty);
    color: var(--ink-soft);
    transition: background-color .2s, color .2s, border-color .2s;
  }
  .slot.is-drawn {
    border: 1px solid var(--brass);
    background: var(--brass);
    color: var(--ground);
    font-family: Fraunces, Georgia, serif;
    font-variation-settings: "opsz" 40;
    font-weight: 700;
    font-size: 1rem;
  }
  .slot.is-latest {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .ball.is-tumbling, .numeral.is-settling { animation: none; }
    button { transition: none; }
  }
</style>

<main class="drum">
  <header class="masthead">
    <h1>Tombola</h1>
    <p class="rule">One to ten &middot; never twice</p>
  </header>

  <section class="stage">
    <div class="ball is-empty" id="ball">
      <span class="numeral" id="numeral" aria-hidden="true">&mdash;</span>
    </div>
    <p class="caption" id="caption">Shake the drum to draw a number.</p>
  </section>

  <div class="controls">
    <button class="shake" id="shake" type="button">Shake</button>
    <button class="reset" id="reset" type="button">Refill the drum</button>
  </div>

  <section class="rack">
    <div class="rack-label">
      <span>Drawn</span>
      <span class="tally" id="tally">0 / 10</span>
    </div>
    <div class="slots" id="slots"></div>
  </section>

  <p class="visually-hidden" role="status" aria-live="polite" id="status"></p>
</main>

<script>
  const TOTAL = 10;
  const CYCLE_MS = 55;
  const TUMBLE_MS = 520;

  const ball    = document.getElementById('ball');
  const numeral = document.getElementById('numeral');
  const caption = document.getElementById('caption');
  const shakeBtn = document.getElementById('shake');
  const resetBtn = document.getElementById('reset');
  const slotsEl = document.getElementById('slots');
  const tallyEl = document.getElementById('tally');
  const statusEl = document.getElementById('status');

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  let drawn = [];
  let spinning = false;

  const remaining = () =>
    Array.from({ length: TOTAL }, (_, i) => i + 1).filter(n => !drawn.includes(n));

  function renderRack() {
    slotsEl.replaceChildren();
    const latest = drawn[drawn.length - 1];
    for (let n = 1; n <= TOTAL; n++) {
      const slot = document.createElement('div');
      const isDrawn = drawn.includes(n);
      slot.className = 'slot'
        + (isDrawn ? ' is-drawn' : '')
        + (n === latest ? ' is-latest' : '');
      slot.textContent = n;
      slotsEl.appendChild(slot);
    }
    tallyEl.textContent = drawn.length + ' / ' + TOTAL;
  }

  function setNumeral(text, big) {
    numeral.textContent = text;
    ball.classList.toggle('is-empty', !big);
  }

  function land(pick) {
    drawn.push(pick);
    setNumeral(pick, true);

    numeral.classList.remove('is-settling');
    void numeral.offsetWidth;          // restart the settle animation
    numeral.classList.add('is-settling');

    renderRack();

    const left = remaining().length;
    if (left === 0) {
      shakeBtn.disabled = true;
      shakeBtn.textContent = 'Drum empty';
      caption.textContent = 'All ten drawn. Refill to start a new round.';
    } else {
      caption.textContent = left + (left === 1 ? ' number left in the drum.' : ' numbers left in the drum.');
    }
    statusEl.textContent = 'Drew ' + pick + '. ' + left + ' remaining.';
  }

  function shake() {
    if (spinning) return;
    const pool = remaining();
    if (pool.length === 0) return;

    const pick = pool[Math.floor(Math.random() * pool.length)];

    if (reducedMotion.matches) {
      land(pick);
      return;
    }

    spinning = true;
    shakeBtn.disabled = true;
    caption.textContent = 'Shaking…';

    ball.classList.remove('is-tumbling');
    void ball.offsetWidth;             // restart the tumble animation
    ball.classList.add('is-tumbling');

    // Flash only through numbers still in the drum, so the tumble shows the rule.
    let i = Math.floor(Math.random() * pool.length);
    const cycle = setInterval(() => {
      i = (i + 1) % pool.length;
      setNumeral(pool[i], true);
    }, CYCLE_MS);

    setTimeout(() => {
      clearInterval(cycle);
      ball.classList.remove('is-tumbling');
      spinning = false;
      shakeBtn.disabled = false;
      land(pick);
    }, TUMBLE_MS);
  }

  function reset() {
    drawn = [];
    spinning = false;
    setNumeral('—', false);
    numeral.classList.remove('is-settling');
    ball.classList.remove('is-tumbling');
    shakeBtn.disabled = false;
    shakeBtn.textContent = 'Shake';
    caption.textContent = 'Shake the drum to draw a number.';
    statusEl.textContent = 'Drum refilled. All ten numbers are back in.';
    renderRack();
  }

  shakeBtn.addEventListener('click', shake);
  resetBtn.addEventListener('click', reset);
  renderRack();
</script>
</body>
</html>
